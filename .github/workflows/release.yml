name: Release integration candidate

# Run after the version/metadata PR is reviewed and merged. Create a NEW
# annotated tag at the reviewed main commit, then dispatch on the tag ref:
# gh workflow run release.yml --ref v0.3.0-rc.1 --field expected_commit=<40-hex-sha>
# Tag pushes alone never publish a release; the historical v0.2.1 tag is not reused.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Full reviewed main commit SHA to which the new tag resolves"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify, attest, and publish Linux x86_64 candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      RELEASE_TARGET: x86_64-unknown-linux-gnu
      RELEASE_ASSETS: release-assets

    steps:
      - name: Check out the exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python for release tooling and documentation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable release input
        shell: bash
        env:
          RELEASE_SETTINGS_READ_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Dispatch this workflow with --ref on the new version tag."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            echo "::error::Expected a new SemVer release-candidate tag."
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit must be the full reviewed commit SHA."
            exit 1
          fi
          git fetch origin main --tags
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]] ||
             [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$EXPECTED_COMMIT" ]] ||
             [[ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ]] ||
             [[ "$(git rev-parse origin/main)" != "$EXPECTED_COMMIT" ]] ||
             [[ "$GITHUB_SHA" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::The annotated tag, checkout, event, and current main must resolve to the same reviewed commit."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::This tag already has a release; never overwrite or reuse it."
            exit 1
          fi
          if [[ -z "$RELEASE_SETTINGS_READ_TOKEN" ]]; then
            echo "::error::Set RELEASE_SETTINGS_READ_TOKEN with repository Administration read permission."
            exit 1
          fi
          if [[ "$(GH_TOKEN="$RELEASE_SETTINGS_READ_TOKEN" gh api --header "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" != "true" ]]; then
            echo "::error::Enable GitHub release immutability before publishing."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["workspace"]["package"]["version"]
          with open("Cargo.lock", "rb") as source:
              packages = tomllib.load(source)["package"]
          expected = {"renderflow", "renderflow-cli", "renderflow-plugin-sdk"}
          local = {p["name"]: p["version"] for p in packages if p["name"] in expected}
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          assert local == dict.fromkeys(expected, version), local
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"RELEASE_VERSION={version}\n")
          PY
          git diff --exit-code

      - name: Require exact-commit CI, docs, conformance, and scheduled evidence
        shell: bash
        run: |
          set -euo pipefail
          require_green_run() {
            local workflow="$1" event="$2"
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$EXPECTED_COMMIT&per_page=100" |
              jq --exit-status --arg sha "$EXPECTED_COMMIT" --arg event "$event" \
                '[.workflow_runs[] | select(.head_sha == $sha and .event == $event)] | length > 0 and .[0].conclusion == "success"' >/dev/null || {
                  echo "::error::The latest $workflow $event run for $EXPECTED_COMMIT is not green."
                  exit 1
                }
          }
          require_green_run ci.yml push
          require_green_run docs.yml push
          require_green_run conformance.yml workflow_dispatch
          scheduled_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/conformance.yml/runs?event=schedule&per_page=1")"
          SCHEDULED_JSON="$scheduled_json" python3 - <<'PY'
          import datetime as dt
          import json
          import os

          runs = json.loads(os.environ["SCHEDULED_JSON"])["workflow_runs"]
          if len(runs) != 1:
              raise SystemExit("::error::No scheduled maximal conformance run was found")
          run = runs[0]
          completed = dt.datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
          age_days = (dt.datetime.now(dt.timezone.utc) - completed).total_seconds() / 86400
          print(f"Latest scheduled maximal conformance: run {run['id']}, "
                f"head {run['head_sha']}, completed {run['updated_at']}, "
                f"age {age_days:.2f} days, conclusion {run['conclusion']}")
          if run["conclusion"] != "success" or not 0 <= age_days <= 8:
              raise SystemExit("::error::Latest scheduled maximal conformance is red or older than eight days")
          PY

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy, rustfmt

      - name: Verify release manifest and refusal fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "jsonschema>=4,<5"
          python3 -m unittest discover --start-directory scripts/release \
            --pattern "test_*.py" --verbose

      - name: Verify source and native conformance
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --locked -- --deny warnings
          cargo test --workspace --locked
          RENDERFLOW_CONFORMANCE_TIER=fast cargo test --package renderflow --test golden_conformance --locked

      - name: Verify documentation build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check mkdocs-material mike pyyaml
          mkdocs build --strict

      - name: Install exact optional PDF provider for downloaded binary smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/renderflow-img2pdf"
          "$RUNNER_TEMP/renderflow-img2pdf/bin/python" -m pip install \
            --disable-pip-version-check "img2pdf==0.6.3"
          [[ "$("$RUNNER_TEMP/renderflow-img2pdf/bin/img2pdf" --version)" == "img2pdf 0.6.3" ]]
          echo "$RUNNER_TEMP/renderflow-img2pdf/bin" >> "$GITHUB_PATH"

      - name: Build the supported binary and preliminary release assets
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --package renderflow-cli --target "$RELEASE_TARGET"
          mkdir -p "$RELEASE_ASSETS"
          cp "target/$RELEASE_TARGET/release/renderflow" "$RELEASE_ASSETS/renderflow-$RELEASE_TARGET"
          [[ "$(getconf GNU_LIBC_VERSION)" == "glibc 2.39" ]] || {
            echo "::error::The build runner's glibc differs from the declared Ubuntu 24.04 baseline."
            exit 1
          }
          required_glibc="$(readelf --version-info "$RELEASE_ASSETS/renderflow-$RELEASE_TARGET" |
            grep --only-matching --extended-regexp 'GLIBC_[0-9]+\.[0-9]+' |
            sed 's/GLIBC_//' | sort --version-sort --unique | tail --lines=1)"
          if [[ -z "$required_glibc" ]] ||
             [[ "$(printf '%s\n' "$required_glibc" '2.39' | sort --version-sort | tail --lines=1)" != "2.39" ]]; then
            echo "::error::Binary references GLIBC $required_glibc above the reviewed 2.39 baseline."
            exit 1
          fi
          printf 'Built on Ubuntu 24.04 / glibc 2.39; binary max GLIBC requirement: %s\n' "$required_glibc"
          python3 scripts/release/release_assets.py prepare \
            --artifact-dir "$RELEASE_ASSETS" --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT" --target "$RELEASE_TARGET"

      - name: Freeze binary attestation subject
        id: binary_subject
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$RELEASE_ASSETS/renderflow-$RELEASE_TARGET" | cut --delimiter=' ' --fields=1)"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'digest=sha256:%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - name: Sign GitHub build provenance for the binary
        id: provenance
        uses: actions/attest@v4
        with:
          subject-name: renderflow-x86_64-unknown-linux-gnu
          subject-digest: ${{ steps.binary_subject.outputs.digest }}

      - name: Sign GitHub SBOM attestation for the binary
        id: sbom
        uses: actions/attest@v4
        with:
          subject-name: renderflow-x86_64-unknown-linux-gnu
          subject-digest: ${{ steps.binary_subject.outputs.digest }}
          sbom-path: release-assets/renderflow-sbom.spdx.json

      - name: Complete manifest and verify staged assets
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "$RELEASE_ASSETS/renderflow-attestation.json"
          cp "$SBOM_BUNDLE" "$RELEASE_ASSETS/renderflow-sbom-attestation.json"
          python3 scripts/release/release_assets.py manifest \
            --artifact-dir "$RELEASE_ASSETS" --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT" --target "$RELEASE_TARGET" \
            --attestation-bundle "$RELEASE_ASSETS/renderflow-attestation.json" \
            --sbom-attestation-bundle "$RELEASE_ASSETS/renderflow-sbom-attestation.json"
          python3 scripts/release/release_assets.py verify \
            --artifact-dir "$RELEASE_ASSETS" --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT" --target "$RELEASE_TARGET" \
            --verify-attestations --smoke --installer-script scripts/install.sh
          gh attestation verify "$RELEASE_ASSETS/renderflow-$RELEASE_TARGET" \
            --repo "$GITHUB_REPOSITORY" --bundle "$RELEASE_ASSETS/renderflow-attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$EXPECTED_COMMIT"
          gh attestation verify "$RELEASE_ASSETS/renderflow-$RELEASE_TARGET" \
            --repo "$GITHUB_REPOSITORY" --bundle "$RELEASE_ASSETS/renderflow-sbom-attestation.json" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$EXPECTED_COMMIT"

      - name: Create draft prerelease with verified assets
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Renderflow $RELEASE_TAG is the first integration candidate for Flow.

          Reviewed source commit: $EXPECTED_COMMIT
          Verified portable binary: Linux x86_64 GNU on Ubuntu 24.04 with
          glibc 2.39; the binary's maximum required GLIBC symbol is checked.
          Other hosts/platforms and package-manager channels are unverified
          or unpublished by this candidate.

          The release includes SHA-256 checksums, an SPDX SBOM, dependency/license
          notices, a machine-readable provider-lock manifest, and GitHub-signed
          provenance and SBOM attestation bundles. The binary and tag have no
          separate maintainer signature. Verify the asset digest and attestation
          before installation. Historical v0.2.1 remains an unsigned tag.
          EOF
          gh release create "$RELEASE_TAG" "$RELEASE_ASSETS"/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$EXPECTED_COMMIT" \
            --title "Renderflow $RELEASE_TAG integration candidate" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft --prerelease --latest=false

      - name: Download draft assets and independently verify before publication
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$download_dir"
          diff --unified \
            <(find "$RELEASE_ASSETS" -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(find "$download_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          python3 scripts/release/release_assets.py verify \
            --artifact-dir "$download_dir" --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT" --target "$RELEASE_TARGET" \
            --verify-attestations --smoke --installer-script scripts/install.sh
          gh attestation verify "$download_dir/renderflow-$RELEASE_TARGET" \
            --repo "$GITHUB_REPOSITORY" --bundle "$download_dir/renderflow-attestation.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$EXPECTED_COMMIT"
          gh attestation verify "$download_dir/renderflow-$RELEASE_TARGET" \
            --repo "$GITHUB_REPOSITORY" --bundle "$download_dir/renderflow-sbom-attestation.json" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$EXPECTED_COMMIT"
          git fetch origin main --tags
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_COMMIT" ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName |
            jq --exit-status --arg tag "$RELEASE_TAG" '.isDraft == true and .tagName == $tag' >/dev/null
          echo "RELEASE_DOWNLOAD_DIR=$download_dir" >> "$GITHUB_ENV"

      - name: Smoke downloaded assets on a clean offline Ubuntu 24.04 host
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null || {
            echo "::error::Docker is required for no-checkout release verification."
            exit 1
          }
          docker info >/dev/null
          context_dir="$(mktemp -d)"
          cat > "$context_dir/Dockerfile" <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install --yes --no-install-recommends \
              ca-certificates python3 python3-venv python3-pip \
              && python3 -m venv /opt/renderflow-provider \
              && /opt/renderflow-provider/bin/python -m pip install \
                 --disable-pip-version-check "img2pdf==0.6.3" \
              && rm -rf /var/lib/apt/lists/*
          ENV PATH="/opt/renderflow-provider/bin:${PATH}"
          EOF
          # The Docker build context contains only this Dockerfile: no source
          # tree, local binary, credentials, fixtures, or generated artifacts.
          image="renderflow-clean-host:$GITHUB_RUN_ID"
          docker build --pull --tag "$image" "$context_dir"
          docker image inspect "$image" --format 'Clean-host image ID: {{.Id}}'
          verifier="$RUNNER_TEMP/release-verifier.py"
          cp scripts/release/release_assets.py "$verifier"
          # The image was assembled with network access; the actual release
          # execution has no network and only two read-only mounts.
          docker run --rm --network none --read-only \
            --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs "/tmp:rw,nosuid,nodev,size=256m" \
            --mount "type=bind,source=$RELEASE_DOWNLOAD_DIR,target=/assets,readonly" \
            --mount "type=bind,source=$verifier,target=/verify.py,readonly" \
            --env "RELEASE_VERSION=$RELEASE_VERSION" \
            --env "RELEASE_TAG=$RELEASE_TAG" \
            --env "EXPECTED_COMMIT=$EXPECTED_COMMIT" \
            --env "RELEASE_TARGET=$RELEASE_TARGET" \
            "$image" bash -euo pipefail -c '
              . /etc/os-release
              [[ "$ID" == "ubuntu" && "$VERSION_ID" == "24.04" ]]
              [[ "$(getconf GNU_LIBC_VERSION)" == "glibc 2.39" ]]
              [[ "$(img2pdf --version)" == "img2pdf 0.6.3" ]]
              printf "Clean host: Ubuntu %s, %s, %s\n" \
                "$VERSION_ID" "$(getconf GNU_LIBC_VERSION)" "$(img2pdf --version)"
              python3 /verify.py verify \
                --artifact-dir /assets --version "$RELEASE_VERSION" \
                --tag "$RELEASE_TAG" --commit "$EXPECTED_COMMIT" \
                --target "$RELEASE_TARGET" --smoke
            '

      - name: Publish verified immutable prerelease
        shell: bash
        env:
          RELEASE_SETTINGS_READ_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_SETTINGS_READ_TOKEN" ]] ||
             [[ "$(GH_TOKEN="$RELEASE_SETTINGS_READ_TOKEN" gh api \
               --header "X-GitHub-Api-Version: 2026-03-10" \
               "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" != "true" ]]; then
            echo "::error::Repository release immutability is no longer enabled. Draft remains unpublished."
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false --verify-tag
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isImmutable,isPrerelease,tagName,url |
            jq --exit-status --arg tag "$RELEASE_TAG" \
              'select(.isDraft == false and .isImmutable == true and .isPrerelease == true and .tagName == $tag) | .url'
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" \
            "$RELEASE_DOWNLOAD_DIR/renderflow-$RELEASE_TARGET" \
            --repo "$GITHUB_REPOSITORY"
