schema: renderflow/v2
sources:
  - id: font-showcase
    role: manuscript
    path: showcase.md
    format: markdown
targets:
  exact:
    - id: font-showcase-html
      role: digital/web
      format: html
variables:
  renderflow-font-registry: registry-v1.yaml
execution:
  requirements:
    local_only: true
    offline: true
  network: deny
  ai: deny
output:
  bundle_root: output
  naming_template: "{target.role}.{ext}"
