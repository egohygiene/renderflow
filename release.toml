# Legacy cargo-release configuration. The integration candidate follows
# docs/release-candidate.md: review/merge first, then a separately created
# annotated tag on the exact green main commit and manual tag-ref dispatch.
# https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md

# Never create a tag as a side effect of a local cargo-release invocation.
tag = false

# Tag name format
tag-name = "v{{version}}"

# Do not push commits and tags to remote automatically
push = false

# Commit message for the version bump commit
pre-release-commit-message = "chore(release): bump version to {{version}}"

# Do not publish to crates.io by default
publish = false

# Allow dirty working directories (no staged changes required)
allow-branch = ["main"]
