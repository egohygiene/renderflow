name: renderflow
base: core22
version: git
title: Renderflow
summary: Spec-driven document rendering engine
description: |
  Spec-driven document rendering engine for transforming Markdown into
  PDF, HTML, and DOCX output.

  Define your output spec in YAML. Point it at your Markdown. Run one command.

  Requires pandoc to be installed on the host system.
license: MIT
contact: https://github.com/egohygiene/renderflow/issues
issues: https://github.com/egohygiene/renderflow/issues
source-code: https://github.com/egohygiene/renderflow
website: https://github.com/egohygiene/renderflow
grade: stable
confinement: classic

apps:
  renderflow:
    command: bin/renderflow

parts:
  renderflow:
    plugin: rust
    source: .
    rust-channel: "1.94"
    organize:
      renderflow: bin/renderflow
