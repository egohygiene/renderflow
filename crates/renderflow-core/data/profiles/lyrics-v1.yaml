schema: renderflow.profile/v1
description: Derivatives from explicitly supplied manual timed lyrics; no recognition or alignment
targets:
  - id: lyrics.canonical
    role: lyrics/structured
    format: lyrics_json
  - id: lyrics.yaml
    role: lyrics/structured-yaml
    format: yaml
  - id: lyrics.srt
    role: lyrics/subrip
    format: srt
  - id: lyrics.vtt
    role: lyrics/web-captions
    format: vtt
  - id: lyrics.text
    role: lyrics/plain-text
    format: text
  - id: lyrics.markdown
    role: lyrics/markdown
    format: markdown
  - id: lyrics.lrc
    role: lyrics/line-synchronized
    format: lrc
  - id: lyrics.ttml
    role: lyrics/ttml
    format: ttml
policy:
  validation:
    required: true
    failure_mode: branch_local
    allow_unavailable: false
  network: deny
  ai: deny
