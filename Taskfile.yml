# Taskfile for renderflow development workflows
# https://taskfile.dev

version: "3"

tasks:
  package:smoke:
    desc: Verify a captured local Linux candidate; no release or publication authority
    requires:
      vars: [BINARY, VERSION, OUTPUT]
    env:
      RENDERFLOW_CANDIDATE_BINARY: '{{.BINARY}}'
      RENDERFLOW_CANDIDATE_VERSION: '{{.VERSION}}'
      RENDERFLOW_CANDIDATE_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - python3 -B scripts/release/release_assets.py local-smoke --binary "$RENDERFLOW_CANDIDATE_BINARY" --version "$RENDERFLOW_CANDIDATE_VERSION" --output "$RENDERFLOW_CANDIDATE_OUTPUT"

  ci:local:plan:
    desc: Plan the reviewed local selection without executing checks (requires Realm checkout)
    requires:
      vars: [REALM_DIRECTORY]
    env:
      REALM_LOCAL_CI_CHECKOUT: '{{.REALM_DIRECTORY}}'
    cmds:
      - python3 -B "$REALM_LOCAL_CI_CHECKOUT/tools/realm_local_ci.py" plan --repository .

  ci:local:
    desc: Run the selected local checks through Realm; no hosted dispatch or publication
    requires:
      vars: [REALM_DIRECTORY, ACT, OUTPUT]
    env:
      REALM_LOCAL_CI_CHECKOUT: '{{.REALM_DIRECTORY}}'
      REALM_LOCAL_CI_ACT: '{{.ACT}}'
      REALM_LOCAL_CI_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - python3 -B "$REALM_LOCAL_CI_CHECKOUT/tools/realm_local_ci.py" run --repository . --act "$REALM_LOCAL_CI_ACT" --output "$REALM_LOCAL_CI_OUTPUT"

  ci:local:cloud:
    desc: Explicitly opt selected local checks into the managed Docker proxy/CA adapter
    requires:
      vars: [REALM_DIRECTORY, ACT, OUTPUT]
    env:
      REALM_LOCAL_CI_CHECKOUT: '{{.REALM_DIRECTORY}}'
      REALM_LOCAL_CI_ACT: '{{.ACT}}'
      REALM_LOCAL_CI_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - python3 -B "$REALM_LOCAL_CI_CHECKOUT/tools/realm_local_ci.py" run --repository . --act "$REALM_LOCAL_CI_ACT" --output "$REALM_LOCAL_CI_OUTPUT" --cloud-network

  ci:budget:
    desc: Inspect workflow budget sources; qualification remains deferred or unobserved
    cmds:
      - python3 -B scripts/ci_budget.py --event pull_request

  ci:budget:test:
    desc: Run the bounded synthetic workflow-budget source regressions
    cmds:
      - python3 -B -m unittest discover --start-directory tests/ci_budget --pattern 'test_*.py'

  package:check:
    desc: Inspect workspace packaging declarations without building or installing
    cmds:
      - python3 -B scripts/check-packaging.py check

  ci:lock:
    desc: Resolve owning dependency metadata without permitting lockfile changes
    cmds:
      - cargo update --workspace --locked

  ci:workflows:
    desc: Check workflow expression scopes using an explicitly installed actionlint 1.7.12
    requires:
      vars: [ACTIONLINT]
    env:
      WORKFLOW_LINT_EXECUTABLE: '{{.ACTIONLINT}}'
    cmds:
      - python3 -B scripts/check-workflows.py --actionlint "$WORKFLOW_LINT_EXECUTABLE"

  diagnostics:preview:
    desc: Preview generated support categories without creating a bundle
    requires:
      vars: [REQUEST]
    env:
      RENDERFLOW_SUPPORT_REQUEST: '{{.REQUEST}}'
    cmds:
      - renderflow diagnostics preview --request "$RENDERFLOW_SUPPORT_REQUEST"

  diagnostics:bundle:
    desc: Explicitly create a fresh private metadata-only support bundle
    requires:
      vars: [REQUEST, OUTPUT]
    env:
      RENDERFLOW_SUPPORT_REQUEST: '{{.REQUEST}}'
      RENDERFLOW_SUPPORT_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - renderflow diagnostics bundle --request "$RENDERFLOW_SUPPORT_REQUEST" --output "$RENDERFLOW_SUPPORT_OUTPUT"

  diagnostics:inspect:
    desc: Inspect support structure and digest without extracting or trusting content
    requires:
      vars: [BUNDLE]
    env:
      RENDERFLOW_SUPPORT_BUNDLE: '{{.BUNDLE}}'
    cmds:
      - renderflow diagnostics inspect --bundle "$RENDERFLOW_SUPPORT_BUNDLE"

  diagnostics:doctor:
    desc: Describe compiled observability capabilities without discovery or network
    cmds:
      - renderflow diagnostics doctor

  # Full project bootstrap – installs all toolchain dependencies, web dependencies,
  # and builds the renderflow CLI in release mode.
  # Works on Linux, macOS, Termux (Android), and Windows.
  setup:
    desc: Full project setup (installs Rust, Node.js, pnpm, web deps, and builds the CLI)
    summary: |
      Performs a complete development environment bootstrap in one step:

        1. Rust toolchain
             • Termux  – pkg install rust
             • Linux / macOS – rustup (https://rustup.rs)
             • Windows – winget install Rustlang.Rustup

        2. Node.js runtime
             • Termux  – pkg install nodejs
             • macOS   – brew install node
             • Debian/Ubuntu – NodeSource LTS via apt-get
             • Fedora/RHEL   – dnf install nodejs
             • Arch Linux    – pacman -S nodejs npm
             • Windows – winget install OpenJS.NodeJS.LTS

        3. pnpm package manager
             • Termux  – npm install -g pnpm
             • Others  – corepack enable + corepack prepare pnpm@latest

        4. Web workspace dependencies  (pnpm install --frozen-lockfile)

        5. renderflow CLI  (cargo build --locked --release --package renderflow-cli --bin renderflow)

      After setup completes:
        Use the CLI:     ./target/release/renderflow  (or cargo run --locked --package renderflow-cli --bin renderflow -- build)
        Start the web:   task web:dev
    cmds:
      - cmd: |
          #!/usr/bin/env sh
          set -e

          _green='\033[0;32m'
          _yellow='\033[0;33m'
          _reset='\033[0m'
          _ok()   { printf "${_green}✓ %s${_reset}\n" "$*"; }
          _info() { printf "${_yellow}→ %s${_reset}\n" "$*"; }

          _is_termux() { [ -n "${TERMUX_VERSION:-}" ]; }

          # ── Rust ──────────────────────────────────────────────────────────
          if command -v cargo >/dev/null 2>&1; then
            _ok "Rust already installed ($(rustc --version))"
          elif _is_termux; then
            _info "Termux: installing Rust via pkg..."
            pkg install rust -y
          else
            _info "Installing Rust via rustup..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          fi

          # Source cargo env so subsequent commands can find cargo/rustc
          if [ -f "${HOME}/.cargo/env" ]; then
            # shellcheck disable=SC1091
            . "${HOME}/.cargo/env"
          fi

          # ── Node.js ───────────────────────────────────────────────────────
          if command -v node >/dev/null 2>&1; then
            _ok "Node.js already installed ($(node --version))"
          elif _is_termux; then
            _info "Termux: installing Node.js via pkg..."
            pkg install nodejs -y
          elif command -v brew >/dev/null 2>&1; then
            _info "Homebrew: installing Node.js..."
            brew install node
          elif command -v apt-get >/dev/null 2>&1; then
            _info "apt-get: installing Node.js LTS via NodeSource..."
            curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
            sudo apt-get install -y nodejs
          elif command -v dnf >/dev/null 2>&1; then
            _info "dnf: installing Node.js..."
            sudo dnf install -y nodejs npm
          elif command -v pacman >/dev/null 2>&1; then
            _info "pacman: installing Node.js..."
            sudo pacman -S --noconfirm nodejs npm
          else
            printf "⚠  No supported package manager found to install Node.js.\n"
            printf "   Please install Node.js manually: https://nodejs.org\n"
            exit 1
          fi

          # ── pnpm ──────────────────────────────────────────────────────────
          if command -v pnpm >/dev/null 2>&1; then
            _ok "pnpm already installed ($(pnpm --version))"
          elif _is_termux; then
            _info "Termux: installing pnpm via npm..."
            npm install -g pnpm
          else
            _info "Enabling pnpm via corepack..."
            corepack enable
            corepack prepare pnpm@latest --activate
          fi

          # ── Web workspace dependencies ─────────────────────────────────
          _info "Installing web workspace dependencies..."
          pnpm install --frozen-lockfile

          # ── Build renderflow CLI ───────────────────────────────────────
          _info "Building renderflow CLI (release mode)..."
          cargo build --locked --release --package renderflow-cli --bin renderflow

          printf "\n${_green}✅  Setup complete!${_reset}\n\n"
          printf "  Use the CLI:     ./target/release/renderflow\n"
          printf "               or  cargo run --locked --package renderflow-cli --bin renderflow -- build\n"
          printf "  Start the web:   task web:dev\n\n"
        platforms: [linux, darwin]

      - cmd: |
          $ErrorActionPreference = 'Stop'

          function _ok   { param($msg) Write-Host "v $msg" -ForegroundColor Green }
          function _info { param($msg) Write-Host "-> $msg" -ForegroundColor Yellow }

          # ── Rust ──────────────────────────────────────────────────────────
          if (Get-Command cargo -ErrorAction SilentlyContinue) {
            _ok "Rust already installed ($(rustc --version))"
          } else {
            _info "Installing Rust via winget..."
            winget install Rustlang.Rustup --accept-source-agreements --accept-package-agreements
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }

          # ── Node.js ───────────────────────────────────────────────────────
          if (Get-Command node -ErrorAction SilentlyContinue) {
            _ok "Node.js already installed ($(node --version))"
          } else {
            _info "Installing Node.js LTS via winget..."
            winget install OpenJS.NodeJS.LTS --accept-source-agreements --accept-package-agreements
            $env:PATH = "$env:ProgramFiles\nodejs;$env:PATH"
          }

          # ── pnpm ──────────────────────────────────────────────────────────
          if (Get-Command pnpm -ErrorAction SilentlyContinue) {
            _ok "pnpm already installed ($(pnpm --version))"
          } else {
            _info "Enabling pnpm via corepack..."
            corepack enable
            corepack prepare pnpm@latest --activate
          }

          # ── Web workspace dependencies ─────────────────────────────────
          _info "Installing web workspace dependencies..."
          pnpm install --frozen-lockfile

          # ── Build renderflow CLI ───────────────────────────────────────
          _info "Building renderflow CLI (release mode)..."
          cargo build --locked --release --package renderflow-cli --bin renderflow

          Write-Host ""
          Write-Host "Setup complete!" -ForegroundColor Green
          Write-Host ""
          Write-Host "  Use the CLI:     .\target\release\renderflow.exe"
          Write-Host "               or  cargo run --locked --package renderflow-cli --bin renderflow -- build"
          Write-Host "  Start the web:   task web:dev"
          Write-Host ""
        platforms: [windows]

  # Build all workspace packages in debug mode
  build:
    desc: Build the workspace
    cmds:
      - cargo build --locked --workspace

  # Run the project with the default `build` subcommand
  run:
    desc: Run the project
    cmds:
      - cargo run --locked --package renderflow-cli --bin renderflow -- build

  # Run the test suite
  test:
    desc: Run all tests
    cmds:
      - cargo test

  # Build the project in release mode
  release:
    desc: Build the project in release mode
    cmds:
      - cargo build --locked --release --package renderflow-cli --bin renderflow

  # Remove build artifacts
  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  # Check the project for errors without producing a binary
  check:
    desc: Check the project for errors
    cmds:
      - cargo check

  # Format source code
  format:
    desc: Format source code with rustfmt
    cmds:
      - cargo +1.94.0 fmt --all

  format:check:
    desc: Check source formatting with the canonical formatter
    cmds:
      - cargo +1.94.0 fmt --all -- --check

  # Lint source code with Clippy
  lint:
    desc: Lint source code with Clippy
    cmds:
      - cargo clippy

  # Run all benchmarks
  bench:
    desc: Run all benchmarks and open Criterion HTML reports
    cmds:
      - cargo bench

  # Run a single benchmark suite by name (e.g. task bench-suite SUITE=graph_planner)
  bench-suite:
    desc: Run a specific benchmark suite (requires SUITE=<name>)
    cmds:
      - cargo bench --bench {{.SUITE}}
    requires:
      vars:
        - SUITE

  # Run benchmarks without collecting samples (compile-only check)
  bench-check:
    desc: Compile benchmarks without running them
    cmds:
      - cargo bench --no-run

  # Generate CHANGELOG.md from commit history using git-cliff
  changelog:
    desc: Generate CHANGELOG.md from commit history
    cmds:
      - git-cliff -o CHANGELOG.md

  # Cross-compile a release binary for a specific target using `cross`
  # Usage: task cross-build TARGET=<target>
  # Example: task cross-build TARGET=aarch64-unknown-linux-gnu
  cross-build:
    desc: Cross-compile release binary for a target (requires cross and Docker)
    cmds:
      - cross build --target {{.TARGET}} --release
    requires:
      vars:
        - TARGET

  # Build a Debian package (.deb) for the current host architecture
  # Requires: cargo-deb (cargo install cargo-deb)
  package-deb:
    desc: Build a .deb package (requires cargo-deb)
    cmds:
      - cargo build --locked --release --package renderflow-cli --bin renderflow
      - cargo deb --package renderflow-cli --no-build

  # Build an RPM package (.rpm) for the current host architecture
  # Requires: cargo-generate-rpm (cargo install cargo-generate-rpm)
  package-rpm:
    desc: Build a .rpm package (requires cargo-generate-rpm)
    cmds:
      - cargo build --locked --release --package renderflow-cli --bin renderflow
      - cargo generate-rpm --package renderflow-cli

  # Validate the Arch Linux PKGBUILD using namcap
  # Requires: namcap (pacman -S namcap on Arch Linux)
  validate-pkgbuild:
    desc: Validate the Arch Linux PKGBUILD with namcap (requires namcap)
    cmds:
      - namcap pkg/aur/renderflow-git/PKGBUILD

  # Bump the patch version (e.g. 0.1.0 -> 0.1.1), commit, and tag
  # Requires: cargo-release (cargo install cargo-release)
  release-patch:
    desc: Bump patch version, commit, and tag (requires cargo-release)
    cmds:
      - cargo release patch --execute

  # Bump the minor version (e.g. 0.1.0 -> 0.2.0), commit, and tag
  # Requires: cargo-release (cargo install cargo-release)
  release-minor:
    desc: Bump minor version, commit, and tag (requires cargo-release)
    cmds:
      - cargo release minor --execute

  # Bump the major version (e.g. 0.1.0 -> 1.0.0), commit, and tag
  # Requires: cargo-release (cargo install cargo-release)
  release-major:
    desc: Bump major version, commit, and tag (requires cargo-release)
    cmds:
      - cargo release major --execute


  web:install:
    desc: Install web workspace dependencies
    cmds:
      - corepack enable
      - pnpm install --frozen-lockfile

  web:dev:
    desc: Run the Renderflow product site locally
    cmds:
      - pnpm web:dev

  web:format:
    desc: Check web formatting
    cmds:
      - pnpm web:format

  web:lint:
    desc: Lint web sources
    cmds:
      - pnpm web:lint

  web:typecheck:
    desc: Typecheck web sources
    cmds:
      - pnpm web:typecheck

  web:test:
    desc: Run web tests
    cmds:
      - pnpm web:test

  web:build:
    desc: Build the Renderflow product site
    cmds:
      - pnpm web:build

  web:preview:
    desc: Preview the Renderflow product site
    cmds:
      - pnpm web:preview

  web:check:
    desc: Run all web quality checks
    cmds:
      - pnpm web:check

  release:cohort:build:
    desc: Prepare one native v2 binary/contract/SBOM part; never publish
    requires:
      vars: [TARGET, VERSION, SOURCE_REVISION, WORK, OUTPUT]
    env:
      RF_COHORT_TARGET: '{{.TARGET}}'
      RF_COHORT_VERSION: '{{.VERSION}}'
      RF_COHORT_REVISION: '{{.SOURCE_REVISION}}'
      RF_COHORT_WORK: '{{.WORK}}'
      RF_COHORT_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - python3 scripts/release/release_assets.py cohort-build --target "$RF_COHORT_TARGET" --version "$RF_COHORT_VERSION" --commit "$RF_COHORT_REVISION" --work-directory "$RF_COHORT_WORK" --artifact-dir "$RF_COHORT_OUTPUT"

  release:cohort:assemble:
    desc: Assemble explicitly supplied native v2 parts into fresh candidate bytes
    requires:
      vars: [PARTS_REQUEST, OUTPUT]
    env:
      RF_COHORT_PARTS: '{{.PARTS_REQUEST}}'
      RF_COHORT_OUTPUT: '{{.OUTPUT}}'
    cmds:
      - python3 scripts/release/release_assets.py cohort-assemble --parts-request "$RF_COHORT_PARTS" --artifact-dir "$RF_COHORT_OUTPUT"

  release:cohort:handoff:
    desc: Print a v2 publication handoff; does not create a tag or release
    requires:
      vars: [ASSETS, MANIFEST, MANIFEST_SHA256]
    env:
      RF_COHORT_ASSETS: '{{.ASSETS}}'
      RF_COHORT_MANIFEST: '{{.MANIFEST}}'
      RF_COHORT_MANIFEST_SHA256: '{{.MANIFEST_SHA256}}'
    cmds:
      - python3 scripts/release/release_assets.py cohort-handoff --artifact-dir "$RF_COHORT_ASSETS" --manifest "$RF_COHORT_MANIFEST" --manifest-sha256 "$RF_COHORT_MANIFEST_SHA256"

  release:report:publisher:
    desc: Assemble an unsigned publisher report from exact existing release files.
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OWNER_REPORT_REQUEST: '{{.REQUEST}}'
      OWNER_REPORT_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/owner_reports.py publisher --request "$OWNER_REPORT_REQUEST" --output-directory "$OWNER_REPORT_OUTPUT"

  release:report:qualified:
    desc: Assemble an unsigned report from supplied real positive native evidence.
    requires:
      vars: [REQUEST, OUTPUT_DIRECTORY]
    env:
      OWNER_REPORT_REQUEST: '{{.REQUEST}}'
      OWNER_REPORT_OUTPUT: '{{.OUTPUT_DIRECTORY}}'
    cmds:
      - python3 scripts/owner_reports.py qualified --request "$OWNER_REPORT_REQUEST" --output-directory "$OWNER_REPORT_OUTPUT"
