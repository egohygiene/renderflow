[workspace]
members = [
    "crates/renderflow-core",
    "crates/renderflow-cli",
    "crates/renderflow-plugin-sdk",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/egohygiene/renderflow"
homepage = "https://github.com/egohygiene/renderflow"
authors = ["Ego Hygiene <egohygiene@users.noreply.github.com>"]

[profile.bench]
opt-level = 3
lto       = "thin"
debug     = false

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
